$kind: http-request
name: '400 - Negative price'
method: POST
url: '{{baseUrl}}/api/courses'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Bad course",
      "price": -10,
      "level": "BEGINNER",
      "durationHours": 5,
      "instructorId": {{instructorId}},
      "categoryId": {{categoryId}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () { pm.response.to.have.status(400); });
