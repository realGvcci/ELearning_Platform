$kind: http-request
name: '422 - Review without enrollment'
method: POST
url: '{{baseUrl}}/api/reviews'
order: 16000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "studentId": {{student2Id}},
      "courseId": {{courseId}},
      "rating": 4
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 422", function () { pm.response.to.have.status(422); });
