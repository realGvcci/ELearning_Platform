$kind: http-request
name: '400 - Progress out of range'
method: PATCH
url: '{{baseUrl}}/api/enrollments/{{enrollmentId}}/progress'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "progress": 150
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () { pm.response.to.have.status(400); });
