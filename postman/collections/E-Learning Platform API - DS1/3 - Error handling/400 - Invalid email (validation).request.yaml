$kind: http-request
name: '400 - Invalid email (validation)'
method: POST
url: '{{baseUrl}}/api/instructors'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "A",
      "lastName": "B",
      "email": "not-an-email"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () { pm.response.to.have.status(400); });
      pm.test("validationErrors.email present", function () { pm.expect(pm.response.json().validationErrors.email).to.exist; });
