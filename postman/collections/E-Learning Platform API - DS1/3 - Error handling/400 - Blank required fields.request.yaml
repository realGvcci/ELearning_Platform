$kind: http-request
name: '400 - Blank required fields'
method: POST
url: '{{baseUrl}}/api/students'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "",
      "email": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () { pm.response.to.have.status(400); });
      pm.test("validationErrors present", function () { pm.expect(pm.response.json().validationErrors).to.exist; });
