$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/enrollments/{{enrollmentId}}/progress'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "progress": 50
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
