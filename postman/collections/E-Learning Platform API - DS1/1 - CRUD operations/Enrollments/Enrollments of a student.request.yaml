$kind: http-request
method: GET
url: '{{baseUrl}}/api/enrollments/student/{{studentId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Response is a JSON array", function () { pm.expect(pm.response.json()).to.be.an("array"); });
      pm.test("Array is not empty", function () { pm.expect(pm.response.json().length).to.be.above(0); });
