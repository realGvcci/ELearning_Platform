$kind: http-request
method: POST
url: '{{baseUrl}}/api/instructors'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Sarah",
      "lastName": "Ben Ali",
      "email": "sarah{{$timestamp}}@elearning.com",
      "bio": "Senior Java developer"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("instructorId", pm.response.json().id);
      pm.collectionVariables.set("instructorEmail", pm.response.json().email);
