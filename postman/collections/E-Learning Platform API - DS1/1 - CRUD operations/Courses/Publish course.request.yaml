$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/courses/{{courseId}}/publish'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Course is published", function () { pm.expect(pm.response.json().published).to.eql(true); });
