$kind: http-request
method: POST
url: '{{baseUrl}}/api/students'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Amine Khelifi",
      "email": "amine{{$timestamp}}@mail.com",
      "country": "Tunisia"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("studentId", pm.response.json().id);
      pm.collectionVariables.set("studentEmail", pm.response.json().email);
