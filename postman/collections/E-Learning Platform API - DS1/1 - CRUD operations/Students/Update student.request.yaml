$kind: http-request
method: PUT
url: '{{baseUrl}}/api/students/{{studentId}}'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Amine Khelifi",
      "email": "{{studentEmail}}",
      "country": "France"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
