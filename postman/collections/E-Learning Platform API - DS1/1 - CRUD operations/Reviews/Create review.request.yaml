$kind: http-request
method: POST
url: '{{baseUrl}}/api/reviews'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "studentId": {{studentId}},
      "courseId": {{courseId}},
      "rating": 5,
      "comment": "Excellent course, very clear!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("reviewId", pm.response.json().id);
