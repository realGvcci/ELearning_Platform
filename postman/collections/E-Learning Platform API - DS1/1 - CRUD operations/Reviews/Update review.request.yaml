$kind: http-request
method: PUT
url: '{{baseUrl}}/api/reviews/{{reviewId}}'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "rating": 4,
      "comment": "Very good, updated comment"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
