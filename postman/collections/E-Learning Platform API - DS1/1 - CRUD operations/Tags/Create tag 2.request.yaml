$kind: http-request
method: POST
url: '{{baseUrl}}/api/tags'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "spring{{$timestamp}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("tagId2", pm.response.json().id);
