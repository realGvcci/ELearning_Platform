$kind: http-request
method: POST
url: '{{baseUrl}}/api/tags'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "java{{$timestamp}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("tagId", pm.response.json().id);
      pm.collectionVariables.set("tagName", pm.response.json().name);
